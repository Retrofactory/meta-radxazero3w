# Fixed kernel release string: 6.6.89-rockchip (LINUX_VERSION_EXTENSION).
#
# With LOCALVERSION_AUTO the release gets "-g<HEAD>" of the patched tree, and
# linux-yocto commits our patches afresh in every build, so that hash differs
# between builds. A kernel image and a modules package from different builds
# (e.g. one restored from sstate) then disagree on /lib/modules/<release>,
# and no module loads (seen on CI image a7150e2: no AIC8800, no wlan0).
# CONFIG_LOCALVERSION_AUTO is not set
